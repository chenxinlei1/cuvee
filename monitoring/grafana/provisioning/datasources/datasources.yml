apiVersion: 1

datasources:
  - name: Prometheus
    uid: cuvee-prometheus
    type: prometheus
    access: proxy
    url: http://app:3000/api/metrics
    isDefault: true
    jsonData:
      httpMethod: GET
      timeInterval: 5s
    # If CUVEE_METRICS_TOKEN is set, uncomment these two blocks so Grafana
    # can authenticate against /api/metrics:
    # jsonData:
    #   httpMethod: GET
    #   timeInterval: 5s
    #   httpHeaderName1: Authorization
    # secureJsonData:
    #   httpHeaderValue1: Bearer ${CUVEE_METRICS_TOKEN}

  - name: Loki
    uid: cuvee-loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
