services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cuvee
      POSTGRES_USER: cuvee
      POSTGRES_PASSWORD: cuvee-local
    ports:
      - "5432:5432"
    volumes:
      - cuvee-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuvee -d cuvee"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  cuvee-postgres:
