apiVersion: 1

contactPoints:
  - orgId: 1
    name: cuvee-alerts
    receivers:
      - uid: cuvee-webhook
        type: webhook
        settings:
          url: ${ALERT_WEBHOOK_URL}
          httpMethod: POST
        disableResolveMessage: false
      - uid: cuvee-email
        type: email
        settings:
          addresses: ${ALERT_EMAIL}
          singleEmail: false
        disableResolveMessage: false

notificationPolicies:
  - orgId: 1
    receiver: cuvee-alerts
    group_by: ["grafana_folder", "alertname"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
