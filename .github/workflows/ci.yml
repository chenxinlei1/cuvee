name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cuvee
          POSTGRES_USER: cuvee
          POSTGRES_PASSWORD: cuvee-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cuvee -d cuvee"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://cuvee:cuvee-ci@127.0.0.1:5432/cuvee
      CUVEE_AUTH_SECRET: ci-auth-secret-at-least-32-characters
      CUVEE_DOWNLOAD_SECRET: ci-download-secret-at-least-32-characters
      CUVEE_SEED_DEMO_USERS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: node --import tsx --require ./scripts/_server-only-shim.cjs scripts/seed-test-fixtures.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: docker build -t cuvee:${{ github.sha }} .

  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cuvee
          POSTGRES_USER: cuvee
          POSTGRES_PASSWORD: cuvee-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cuvee -d cuvee"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Backup/restore round-trip
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}:/work" -w /work \
            -e PGHOST=127.0.0.1 -e PGPORT=5432 -e PGDATABASE=cuvee \
            -e PGUSER=cuvee -e PGPASSWORD=cuvee-ci \
            postgres:17-alpine /bin/sh scripts/test-backup-restore.sh

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cuvee
          POSTGRES_USER: cuvee
          POSTGRES_PASSWORD: cuvee-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cuvee -d cuvee"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://cuvee:cuvee-ci@127.0.0.1:5432/cuvee
      - run: docker build -t cuvee:ci .
      - name: Run image and probe health + metrics
        run: |
          docker run -d --name cuvee-smoke --network host \
            -e DATABASE_URL=postgresql://cuvee:cuvee-ci@127.0.0.1:5432/cuvee \
            -e CUVEE_AUTH_SECRET=ci-auth-secret-at-least-32-characters \
            -e CUVEE_DOWNLOAD_SECRET=ci-download-secret-at-least-32-characters \
            cuvee:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/api/health
          curl -fsS http://127.0.0.1:3000/api/metrics | grep -q "cuvee_database_up 1"
          curl -fsS http://127.0.0.1:3000/api/metrics | grep -q "cuvee_process_uptime_seconds"

  observability-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Start full stack (app + postgres + loki + promtail + grafana)
        run: docker compose up -d --build
      - name: Wait for app, Loki and Grafana
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:3000/api/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:3000/api/health | grep -q '"database":true'
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3100/ready >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:3100/ready
          for i in $(seq 1 60); do
            if curl -fsS -u admin:admin http://localhost:3001/api/health >/dev/null 2>&1; then
              echo "grafana ready after $((i * 2))s"
              break
            fi
            sleep 2
          done
          curl -fsS -u admin:admin http://localhost:3001/api/health >/tmp/grafana-health.json ||
            { echo "grafana health check failed"; docker compose ps; docker compose logs grafana --tail=80; docker compose logs loki --tail=20; exit 1; }
          cat /tmp/grafana-health.json
          python3 -c 'import json,sys; d=json.load(open("/tmp/grafana-health.json")); sys.exit(0 if d.get("database")=="ok" else 1)' ||
            { echo "grafana database not ok"; docker compose logs grafana --tail=80; exit 1; }
      - name: Verify Grafana provisioning
        run: |
          curl -fsS -u admin:admin http://localhost:3001/api/v1/provisioning/datasources | grep -q '"uid":"cuvee-prometheus"'
          curl -fsS -u admin:admin http://localhost:3001/api/v1/provisioning/datasources | grep -q '"uid":"cuvee-loki"'
          RULES=$(curl -fsS -u admin:admin http://localhost:3001/api/v1/provisioning/alert-rules)
          for uid in cuvee-analysis-failure-rate cuvee-worker-heartbeat-stale cuvee-database-down cuvee-backup-stale cuvee-backup-failed; do
            echo "$RULES" | grep -q "\"uid\":\"$uid\"" || { echo "missing alert rule $uid" >&2; exit 1; }
          done
          curl -fsS -u admin:admin http://localhost:3001/api/dashboards/uid/cuvee-overview | grep -q '"title":"Cuvée Overview"'
      - name: Verify promtail → Loki log pipeline
        run: |
          sleep 15
          python3 - <<'EOF'
          import json, time, urllib.parse, urllib.request
          query = '{container="cuvee-grafana-1"}'
          url = "http://localhost:3100/loki/api/v1/query?" + urllib.parse.urlencode(
              {"query": query, "limit": "5", "time": str(int(time.time()))}
          )
          data = json.load(urllib.request.urlopen(url, timeout=15))
          streams = data["data"]["result"]
          assert any(len(stream.get("values", [])) > 0 for stream in streams), (
              f"no Grafana-container logs in Loki for {query}"
          )
          print("log pipeline OK:", json.dumps(streams, ensure_ascii=False)[:200])
          EOF
